<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Una domanda importante 💘</title>

<style>
html, body {
    height: 100%;
    margin: 0;
    background: #ffe6e6;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

.container {
    text-align: center;
}

img {
    width: 180px;
    margin-bottom: 20px;
}

#gifHover {
    display: none;
}

button {
    padding: 20px 40px;
    font-size: 18px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    margin: 10px;
    transition: 0.3s;
}

#si {
    background: #66ff99;
}

#no {
    background: #ff6666;
    position: relative;
}

@keyframes cuore {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-120vh); opacity: 0; }
}
</style>
</head>

<body>
<div class="container">

<img id="gif" src="data:image/gif;base64,R0lGODlhEAAQAMQAAORHHOVMKudcQ+hfUOZrY+pwbe9yefF2g/N9i/x/iP6CjP+Ekf+Jl/+RmP+TnP+cof+eqP+iqP+nrP+psf+usf+ytf+3uP+6vP/Bwf/DxP/Fxf/IyP/KyP/Nzf/Q0P/T0f/V1f/Y2P/b2f/e3f/h4f/k5P/n5f/r6P/u7f/x8P/z8f/19f/4+P/7+/v///8AAAAAACH5BAEAAB8ALAAAAAAQABAAAAVu4CeOZGmeaKqubOtCzPMwDAdYpEME6j2yUQkJgRBJc5BSoEgYJQeLxLw4Cw6GxEAgWCoGg+Hg0Gg4DAwKAh+PAgEAOw==" alt="gattino">

<img id="gifHover" src="data:image/gif;base64,R0lGODlhEAAQAMQAAACZmZmqqqqurq6zs7O/v7/Dw8PX19fj4+Pn5+fr6+vv7+/z8/P39/f7+/v///8AAAAAACH5BAEAAB8ALAAAAAAQABAAAAVp4CeOZGmeaKqubOtCzPMwDAdYpEME6j2yUQkJgRBJc5BSoEgYJQeLxLw4Cw6GxEAgWCoGg+Hg0Gg4DAwKAh+PAgEAOw==" alt="cuori">

<h1 id="frase">Vuoi essere la mia Valentine? 💖</h1>

<button id="si">Yes 💘</button>
<button id="no">No 💔</button>

</div>

<script>
const si = document.getElementById("si");
const no = document.getElementById("no");
const gif = document.getElementById("gif");
const gifHover = document.getElementById("gifHover");
const frase = document.getElementById("frase");

const frasi = ["Sei sicura?", "Daiii 🥺", "Non farlo 😢", "Il mio cuore 💔"];
let i = 0;

no.addEventListener("mouseover", () => {
    no.style.position = "absolute";
    no.style.left = Math.random() * (window.innerWidth - 120) + "px";
    no.style.top = Math.random() * (window.innerHeight - 60) + "px";
    if (i < frasi.length) no.innerText = frasi[i++];
});

si.addEventListener("mouseover", () => {
    gifHover.style.display = "block";
    no.style.display = "none";
});

si.addEventListener("mouseout", () => {
    gifHover.style.display = "none";
    no.style.display = "inline-block";
});

si.addEventListener("click", () => {
    frase.innerText = "TI AMO ❤️";
    pioggiaCuori();
});

function pioggiaCuori() {
    for (let i = 0; i < 25; i++) {
        const c = document.createElement("div");
        c.innerText = "❤️";
        c.style.position = "fixed";
        c.style.left = Math.random() * 100 + "vw";
        c.style.top = "100vh";
        c.style.fontSize = "24px";
        c.style.animation = "cuore 3s linear";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 3000);
    }
}
</script>
</body>
</html>
